[licenses]

# We want really high confidence when inferring licenses from text
confidence-threshold = 0.93

# Commented license types are allowed but not currently used
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    # "OpenSSL",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

exceptions = [
    { name = "libfuzzer-sys", allow = ["NCSA"], version = "*" },
]

[bans]
# Deny multiple versions or wildcard dependencies.
multiple-versions = "deny"
wildcards = "deny"

skip = [
    # Allow duplicate versions of these crates due to transitive dependencies
    # from candle, hf-hub, tokenizers ecosystem
    { name = "base64", version = "*" },
    { name = "console", version = "*" },
    { name = "core-foundation", version = "*" },
    { name = "darling", version = "*" },
    { name = "darling_core", version = "*" },
    { name = "darling_macro", version = "*" },
    { name = "dirs", version = "*" },
    { name = "dirs-sys", version = "*" },
    { name = "getrandom", version = "*" },
    { name = "indicatif", version = "*" },
    { name = "redox_users", version = "*" },
    { name = "reqwest", version = "*" },
    { name = "thiserror", version = "*" },
    { name = "thiserror-impl", version = "*" },
    { name = "unicode-width", version = "*" },
    { name = "webpki-roots", version = "*" },
    { name = "windows-sys", version = "*" },
    { name = "windows-targets", version = "*" },
    { name = "windows_aarch64_gnullvm", version = "*" },
    { name = "windows_aarch64_msvc", version = "*" },
    { name = "windows_i686_gnu", version = "*" },
    { name = "windows_i686_gnullvm", version = "*" },
    { name = "windows_i686_msvc", version = "*" },
    { name = "windows_x86_64_gnu", version = "*" },
    { name = "windows_x86_64_gnullvm", version = "*" },
    { name = "windows_x86_64_msvc", version = "*" },
]

[bans.workspace-dependencies]
duplicates = "deny"
include-path-dependencies = true
unused = "warn"

[sources]
# Deny crates from unknown registries or git repositories.
unknown-registry = "deny"
unknown-git = "deny"
