[[commits]]
id = 1
title = "throttlesys: Add crate skeleton and protocol types"
message = """feat(throttlesys): add crate skeleton and wire protocol

Implements protocol message encoding/decoding per design.md wire protocol spec.
All multi-byte integers use big-endian (network byte order) per CC-4.

Message types: AcquireRequest, AcquireResponse, ReleaseRequest,
ReleaseResponse, Disconnect, Error."""
files = [
    "twoliter/tools/throttlesys/Cargo.toml",
    "twoliter/tools/throttlesys/src/lib.rs",
    "twoliter/tools/throttlesys/src/protocol.rs",
]
acceptance = [
    "Cargo.toml with tokio, jobserver, thiserror dependencies",
    "Protocol Message enum with all 6 variants",
    "encode() and decode() functions for wire format",
    "Big-endian encoding for Length field (CC-4)",
    "Version byte = 0x01",
]
anti_patterns = [
    "Using native endianness instead of big-endian",
    "Missing version field in wire format",
    "Incomplete error handling in decode",
]
tests = [
    "test_protocol_big_endian",
    "test_protocol_encode_acquire_request",
    "test_protocol_encode_acquire_response",
    "test_protocol_encode_release_request",
    "test_protocol_encode_disconnect",
    "test_protocol_encode_error",
    "test_protocol_decode_roundtrip",
    "test_protocol_invalid_version",
    "test_protocol_invalid_type",
]

[[commits]]
id = 2
title = "throttlesys: Add token ownership tracking with FIFO queue"
message = """feat(throttlesys): add ownership module for token tracking

Implements CC-7 (FIFO ordering) via PendingRequest queue.
TokenOwnership tracks client_id -> tokens mapping for recovery (THR-6, THR-20)."""
files = [
    "twoliter/tools/throttlesys/src/ownership.rs",
    "twoliter/tools/throttlesys/src/lib.rs",
]
acceptance = [
    "TokenOwnership struct tracking client->tokens mapping",
    "PendingRequest with client_id, requested_at, response channel",
    "FIFO queue for pending requests",
    "Methods: track_acquire, track_release, recover_client_tokens",
    "O(clients) memory usage",
]
anti_patterns = [
    "LIFO or random ordering instead of FIFO",
    "Not tracking ownership per-client",
    "Memory growing with transactions instead of clients",
]
tests = [
    "test_ownership_tracks_client_tokens",
    "test_fifo_ordering",
]

