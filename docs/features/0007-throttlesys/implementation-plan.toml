[[commits]]
id = 4
title = "throttlesys: Implement ThrottleServer core"
message = """feat(throttlesys): implement ThrottleServer wrapping jobserver

Server binds to abstract UDS, handles token acquire/release via protocol.
Uses spawn_blocking for jobserver crate calls (CC-5).
Wraps jobserver::Client, not custom pool (CC-1)."""
files = [
    "twoliter/tools/throttlesys/src/server.rs",
    "twoliter/tools/throttlesys/src/lib.rs",
]
acceptance = [
    "ThrottleServer::start() creates jobserver::Client with N tokens",
    "Binds to abstract socket @{socket_name}",
    "acquire_token() uses spawn_blocking for jobserver.acquire()",
    "release_token() uses spawn_blocking for jobserver.release()",
    "Socket collision returns clear error",
]
anti_patterns = [
    "Custom token pool instead of jobserver::Client (CC-1)",
    "Blocking async runtime with jobserver calls (CC-5)",
    "Non-abstract socket path",
]
tests = [
    "test_server_uses_jobserver_protocol",
    "test_server_binds_abstract_socket",
    "test_server_unique_socket_name",
    "test_server_socket_collision_error",
    "test_spawn_blocking_for_jobserver",
    "test_startup_sequence_order",
]

